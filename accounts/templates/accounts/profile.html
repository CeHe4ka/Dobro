{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль</title>
  <link rel="stylesheet" href="{% static 'styles/fonts.css' %}" />
  <link rel="stylesheet" href="{% static 'styles/variables.css' %}" />
  <link rel="stylesheet" href="{% static 'styles/style-profile.css' %}" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body>
  <section class="sidebar">
    <nav class="sidebar__nav">
      <ul class="sidebar__list">
        <li class="sidebar__item"><span class="sidebar__logo">Добро</span></li>
        <li class="sidebar__item"><i class="material-icons">home</i><span><a href="{% url 'accounts:dashboard' %}">Главная</a></span></li>
        <li class="sidebar__item"><i class="material-icons">star</i><span><a href="{% url 'videos:favorites' %}">Избранное</a></span></li>
        <li class="sidebar__item"><i class="material-icons">history</i><span><a href="{% url 'videos:history' %}">История</a></span></li>
        <li class="sidebar__item"><i class="material-icons">watch_later</i><span><a href="{% url 'videos:later' %}">Позже</a></span></li>
        <li class="sidebar__item"><i class="material-icons">person</i><span><a href="{% url 'accounts:profile' %}">Профиль</a></span></li>
      </ul>
    </nav>
  </section>

  <section class="main">
    <h1 class="profile-title">Профиль пользователя</h1>
    <div class="profile-card">
      <img class="profile-photo" src="{ static 'img/avatar-placeholder.png' %}" alt="Аватар" />
      <div class="profile-info">
        <p><strong>ФИО:</strong> Иванов Иван Иванович</p>
        <p><strong>Дата рождения:</strong> 01.01.1990</p>
        <p><strong>Email:</strong> ivanov@example.com</p>
        <button class="btn btn-edit" onclick="openEditModal()">Редактировать</button>
      </div>
    </div>
  </section>

  <!-- Модальное окно редактирования -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h2>Редактировать профиль</h2>
    <form class="edit-form">
      <label>Фото: <input type="file" /></label>
      <label>ФИО: <input type="text" value="Иванов Иван Иванович" /></label>
      <label>Дата рождения: <input type="date" value="1990-01-01" /></label>
      <label>Email: <input type="email" value="ivanov@example.com" /></label>
      <label>Пароль: <input type="password" value="12345678" disabled /></label>
      <button type="button" class="btn" onclick="openPasswordModal()">Изменить пароль</button>
      <div class="buttons">
        <button type="button" onclick="closeEditModal()">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </div>
</div>
<!-- Модальное окно смены пароля -->
<div class="modal" id="passwordModal">
  <div class="modal-content">
    <h2>Смена пароля</h2>
    <form class="edit-form">
      <label>Старый пароль: <input type="password" required /></label>
      <label>Новый пароль: <input type="password" required /></label>
      <label>Повторите новый пароль: <input type="password" required /></label>
      <div class="buttons">
        <button type="button" onclick="closePasswordModal()">Отмена</button>
        <button type="submit">Подтвердить</button>
      </div>
    </form>
  </div>
</div>



  <script>
  function openEditModal() {
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  function openPasswordModal() {
    closeEditModal();
    document.getElementById('passwordModal').style.display = 'flex';
  }

  function closePasswordModal() {
    document.getElementById('passwordModal').style.display = 'none';
    openEditModal();
  }
</script>

</body>
</html>
